<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Connexion — Minerva Flow</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #f5f1e6;
    color: #1a1e16;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  .card {
    max-width: 420px;
    width: 100%;
    background: #fffefa;
    border: 1px solid #e6e0d0;
    border-radius: 20px;
    padding: 36px 28px 30px;
    box-shadow: 0 8px 24px rgba(26, 30, 22, 0.04);
  }
  .dot {
    width: 54px; height: 54px; border-radius: 14px;
    background: #167f5b; margin: 0 auto 18px;
    display: flex; align-items: center; justify-content: center;
    color: #fffefa; font-size: 24px; font-weight: 700;
  }
  h1 { font-size: 20px; margin: 0 0 8px; font-weight: 700; }
  p { font-size: 13.5px; color: #565f52; line-height: 1.55; margin: 0 0 18px; }
  .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  button, a.btn {
    display: block; width: 100%; border: none; border-radius: 999px;
    background: #167f5b; color: #fffefa; font-size: 14px; font-weight: 600;
    padding: 12px 20px; cursor: pointer; text-decoration: none;
  }
  a.btn-secondary {
    background: #e2efe7; color: #0e5a40; border: 1px solid #b8dcc8;
  }
  button:active, a.btn:active { opacity: 0.9; }
</style>
</head>
<body>
  <div class="card">
    <div class="dot">M</div>
    <h1 id="titleText">Vérification de la connexion</h1>
    <p id="descText">Tentative de rétablissement de la liaison avec Minerva Flow...</p>
    
    <div class="btn-group">
      <button id="retryBtn" onclick="retryConnection()">Réessayer la connexion</button>
      <a id="vercelFallbackBtn" href="https://minerva-flow.vercel.app" class="btn btn-secondary" style="display:none;">
        Ouvrir via le lien direct Vercel →
      </a>
    </div>
  </div>

  <script>
    const VERCEL_FALLBACK_BASE = "https://minerva-flow.vercel.app";

    function checkAndFailover() {
      const isCustomDomain = window.location.hostname === 'minervaflow.app';
      const fallbackBtn = document.getElementById('vercelFallbackBtn');
      const descText = document.getElementById('descText');
      const titleText = document.getElementById('titleText');

      if (isCustomDomain) {
        if (fallbackBtn) fallbackBtn.style.display = 'block';
        if (descText) descText.textContent = "Si le nom de domaine principal est temporairement indisponible, vous pouvez basculer instantanément sur l'accès direct Vercel.";
        
        // Auto-redirect to Vercel mirror if custom domain fetch fails
        fetch(VERCEL_FALLBACK_BASE + '/api/health', { mode: 'cors' })
          .then(function(res) {
            if (res.ok) {
              const currentPath = window.location.pathname + window.location.search;
              window.location.href = VERCEL_FALLBACK_BASE + currentPath;
            }
          })
          .catch(function() {});
      }
    }

    function retryConnection() {
      const btn = document.getElementById('retryBtn');
      if (btn) btn.textContent = 'Connexion en cours...';
      
      if ('serviceWorker' in navigator && (location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          return Promise.all(regs.map(function(r) { return r.unregister(); }));
        }).then(function() {
          window.location.reload();
        }).catch(function() {
          window.location.reload();
        });
      } else {
        window.location.reload();
      }
    }

    window.addEventListener('online', function() {
      retryConnection();
    });

    // Check automatically on load
    setTimeout(checkAndFailover, 1200);
  </script>
</body>
</html>
