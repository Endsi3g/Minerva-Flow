name: Retention engine

# See check-late-shifts.yml — moved off vercel.json's `crons` because the
# project is on Vercel's Hobby plan (max 2 cron jobs total).
on:
  schedule:
    # Three runs a day (9:00, 13:00 and 17:00 Montréal time, EDT). The default
    # cadence is unchanged (the per-restaurant cap in days still applies);
    # extra runs only serve customers who opted in to "Fréquent".
    - cron: "0 13,17,21 * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call retention-engine
        run: |
          curl -sf -X GET "https://minerva-flow.vercel.app/api/cron/retention-engine" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
