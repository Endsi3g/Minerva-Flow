name: POS catalog reconcile

# See check-late-shifts.yml — moved off vercel.json's `crons` because the
# project is on Vercel's Hobby plan (max 2 cron jobs total). Pulls
# POS-side menu/inventory changes back into Minerva Flow every 15 minutes
# (see app/api/cron/pos-catalog-reconcile/route.ts).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call pos-catalog-reconcile
        run: |
          curl -sf -X GET "https://minerva-flow.vercel.app/api/cron/pos-catalog-reconcile" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
