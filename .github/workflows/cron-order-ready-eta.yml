name: Order ready ETA

# See check-late-shifts.yml — moved off vercel.json's `crons` because the
# project is on Vercel's Hobby plan (max 2 cron jobs total). This is the
# 5-minute poll that auto-notifies a customer once their order's
# estimated_ready_at elapses (see app/api/cron/order-ready-eta/route.ts).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call order-ready-eta
        run: |
          curl -sf -X GET "https://minerva-flow.vercel.app/api/cron/order-ready-eta" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
