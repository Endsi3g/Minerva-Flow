name: Poll Google reviews

# See check-late-shifts.yml — moved off vercel.json's `crons` because the
# project is on Vercel's Hobby plan (max 2 cron jobs total).
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call poll-google-reviews
        run: |
          curl -sf -X GET "https://minerva-flow.vercel.app/api/cron/poll-google-reviews" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
