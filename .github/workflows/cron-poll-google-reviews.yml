name: Poll Google reviews

# See check-late-shifts.yml — moved off vercel.json's `crons` because the
# project is on Vercel's Hobby plan (max 2 cron jobs total).
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call poll-google-reviews
        run: |
          HTTP_STATUS="$(curl -sS -o response.json -w '%{http_code}' -X GET "https://minerva-flow.vercel.app/api/cron/poll-google-reviews" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")"
          if [[ "$HTTP_STATUS" != 2* ]]; then
            echo "::error::Google reviews cron returned HTTP $HTTP_STATUS"
            cat response.json
            exit 1
          fi
          echo "Google reviews cron completed (HTTP $HTTP_STATUS)."
