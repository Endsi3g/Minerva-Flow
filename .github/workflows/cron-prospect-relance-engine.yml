name: Prospect relance engine

# See check-late-shifts.yml — moved off vercel.json's `crons` because the
# project is on Vercel's Hobby plan (max 2 cron jobs total).
on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call prospect-relance-engine
        run: |
          curl -sf -X GET "https://minerva-flow.vercel.app/api/cron/prospect-relance-engine" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
