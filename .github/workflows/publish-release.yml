name: Publish release to changelog

# Fires whenever a GitHub release is published (see the standing release
# workflow: gh release create after a green-CI merge) and turns it into a
# changelog entry + email campaign automatically (no in-app/push) — see
# app/api/system/publish-release/route.ts. Replaces the manual "publish
# from admin" step that used to have to follow every release by hand.
on:
  release:
    types: [published]

jobs:
  announce:
    # Release candidates are source snapshots, not validated product updates.
    # Publishing them must not call Production or notify restaurant members.
    if: ${{ github.event.release.prerelease == false && github.event.release.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify app of new release
        env:
          RELEASE_TITLE: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_ASSETS_JSON: ${{ toJson(github.event.release.assets) }}
          RELEASE_WEBHOOK_SECRET: ${{ secrets.RELEASE_WEBHOOK_SECRET }}
        run: |
          TITLE="${RELEASE_TITLE:-$RELEASE_TAG}"
          RELEASE_IMAGE_URL="$(printf '%s' "$RELEASE_ASSETS_JSON" | jq -r '[.[] | select((.content_type // "") | test("^image/(png|jpeg|webp|gif)$")) | .browser_download_url][0] // empty')"
          if [ -z "$RELEASE_IMAGE_URL" ]; then
            echo "::error::Attach a PNG, JPG, WebP, or GIF screenshot to the GitHub release before publishing."
            exit 1
          fi
          jq -n --arg title "$TITLE" --arg body "$RELEASE_BODY" --arg imageUrl "$RELEASE_IMAGE_URL" \
            '{title: $title, body: $body, imageUrl: $imageUrl}' > payload.json
          HTTP_STATUS="$(curl -sS -o response.json -w '%{http_code}' -X POST "https://minerva-flow.vercel.app/api/system/publish-release" \
            -H "Authorization: Bearer $RELEASE_WEBHOOK_SECRET" \
            -H "Content-Type: application/json" \
            --data @payload.json)"
          if [[ "$HTTP_STATUS" != 2* ]]; then
            echo "::error::Release webhook returned HTTP $HTTP_STATUS"
            cat response.json
            exit 1
          fi
          cat response.json
