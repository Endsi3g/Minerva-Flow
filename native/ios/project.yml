name: MinervaFlow
options:
  bundleIdPrefix: com.minervaflow
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.29.0
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: 8.44.0

targets:
  MinervaFlow:
    type: application
    platform: iOS
    sources:
      - path: MinervaFlow/Sources
      - path: MinervaFlow/Resources
      - path: Shared
    info:
      path: MinervaFlow/Resources/Info.plist
      properties:
        CFBundleDisplayName: "Minerva Flow"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LogoMark
        CFBundleURLTypes:
          - CFBundleURLName: app.minervaflow.oauth
            CFBundleURLSchemes:
              - minervaflow
        NSFaceIDUsageDescription: "Utilisez Face ID pour déverrouiller rapidement votre compte de fidélité Minerva Flow."
        NSLocationWhenInUseUsageDescription: "Minerva Flow utilise votre position pour trouver les restaurants et cafés participants les plus proches de vous."
        NSCameraUsageDescription: "Minerva Flow utilise l'appareil photo pour scanner le code du restaurant et accéder directement à son menu."
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: MinervaFlow/Resources/MinervaFlow.entitlements
      properties:
        aps-environment: $(APNS_ENVIRONMENT)
        com.apple.security.application-groups:
          - group.com.minervatechnologies.shared
        com.apple.developer.applesignin:
          - Default
        com.apple.developer.associated-domains:
          - applinks:minervaflow.app
        com.apple.developer.pass-type-identifiers:
          - $(TeamIdentifierPrefix)pass.com.minervaflow.loyalty
    dependencies:
      - package: Supabase
        product: Supabase
      - package: Sentry
        product: Sentry
      - target: MinervaFlowWidgetExtension
        embed: true
    postBuildScripts:
      - name: Copy Sentry dSYM
        script: "bash \"${SRCROOT}/scripts/copy-sentry-dsym.sh\""
        basedOnDependencyAnalysis: false
        showEnvVars: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minervaflow.loyalty
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "13"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: NHMPLN46TN
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
        PROVISIONING_PROFILE_SPECIFIER: Minerva Flow Wallet Development
      configs:
        Debug:
          APNS_ENVIRONMENT: development
          CODE_SIGN_IDENTITY: Apple Development
          CODE_SIGN_STYLE: Manual
          PROVISIONING_PROFILE_SPECIFIER: Minerva Flow Wallet Development
        Release:
          APNS_ENVIRONMENT: production
          CODE_SIGN_IDENTITY: Apple Distribution
          CODE_SIGN_STYLE: Manual
          PROVISIONING_PROFILE_SPECIFIER: Minerva Flow Wallet App Store Distribution
    scheme:
      testTargets:
        - MinervaFlowTests
        - MinervaFlowUITests

  MinervaFlowWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: MinervaFlowWidget
      - path: Shared
    info:
      path: MinervaFlowWidget/Info.plist
      properties:
        CFBundleDisplayName: "Minerva Flow"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: MinervaFlowWidget/MinervaFlowWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.minervatechnologies.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minervaflow.loyalty.widget
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "13"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: NHMPLN46TN
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: true
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Minerva Flow Widget App Store Distribution

  MinervaFlowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MinervaFlowTests
    dependencies:
      - target: MinervaFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minervaflow.loyalty.tests
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: NHMPLN46TN
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: true

  MinervaFlowUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MinervaFlowUITests
    dependencies:
      - target: MinervaFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minervaflow.loyalty.uitests
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: NHMPLN46TN
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: MinervaFlow
