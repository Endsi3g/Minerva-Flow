name: MinervaFlow
options:
  bundleIdPrefix: com.minervaflow
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.29.0

targets:
  MinervaFlow:
    type: application
    platform: iOS
    sources:
      - path: MinervaFlow/Sources
      - path: MinervaFlow/Resources
    info:
      path: MinervaFlow/Resources/Info.plist
      properties:
        CFBundleDisplayName: "Minerva Flow"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LogoMark
        CFBundleURLTypes:
          - CFBundleURLName: app.minervaflow.oauth
            CFBundleURLSchemes:
              - minervaflow
        NSFaceIDUsageDescription: "Utilisez Face ID pour déverrouiller rapidement votre compte de fidélité Minerva Flow."
        NSLocationWhenInUseUsageDescription: "Minerva Flow utilise votre position pour trouver les restaurants et cafés participants les plus proches de vous."
        NSCameraUsageDescription: "Minerva Flow utilise l'appareil photo pour scanner le code du restaurant et accéder directement à son menu."
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minervaflow.loyalty
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: DV9V35452J
        CODE_SIGN_STYLE: Automatic
